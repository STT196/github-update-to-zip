<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Git Update Zipper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- Top bar -->
    <header id="topbar">
      <div id="topbarLeft">
        <span id="appIcon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M4.5 3.5C3.67157 3.5 3 4.17157 3 5V18C3 18.8284 3.67157 19.5 4.5 19.5H19.5C20.3284 19.5 21 18.8284 21 18V7C21 6.17157 20.3284 5.5 19.5 5.5H12L10.5 4C10.1 3.6 9.5 3.5 9 3.5H4.5ZM4.5 5.5H9C9.2 5.5 9.4 5.6 9.6 5.8L10.5 7H4.5V5.5ZM4.5 8.5V18H19.5V8.5H4.5Z" fill="currentColor"/>
            <path d="M11.5 10H12.5V10.8H11.5V10ZM11.5 12H12.5V12.8H11.5V12ZM11.5 14H12.5V14.8H11.5V14Z" fill="currentColor"/>
            <path d="M11 8.5H13C13.2761 8.5 13.5 8.72386 13.5 9V10C13.5 10.2761 13.2761 10.5 13 10.5H11C10.7239 10.5 10.5 10.2761 10.5 10V9C10.5 8.72386 10.7239 8.5 11 8.5Z" fill="currentColor"/>
            <path d="M15.5 15.5L17.5 13.5L15.5 11.5V13H14V14H15.5V15.5Z" fill="currentColor"/>
          </svg>
      </span>
        <span id="appTitle">Git Update Zipper</span>
      </div>
      <div id="topbarRight">
        <button id="themeToggle" class="theme-btn" title="Toggle dark/light mode">
          <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3V4M12 20V21M4 12H3M21 12H20M6.31412 6.31412L5.5 5.5M18.5 18.5L17.6859 17.6859M6.31412 17.6859L5.5 18.5M18.5 5.5L17.6859 6.31412M16 12C16 14.2091 14.2091 16 12 16C9.79086 16 8 14.2091 8 12C8 9.79086 9.79086 8 12 8C14.2091 8 16 9.79086 16 12Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
          </svg>
        </button>
        <span id="branchPill" class="pill" style="display:none"></span>
        <span id="gitStatus" class="pill pill-muted">checking git…</span>
      </div>
    </header>

    <div id="body">

      <!-- Column 1: Repositories -->
      <aside id="repoPanel">
        <div id="currentRepoHeader">
          <div class="repo-header-row">
            <span id="currentRepoName" class="repo-header-name">Select a repo</span>
          </div>
        </div>
        <div id="searchBar">
          <div class="search-input-wrap">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M11.5 3C16.1944 3 20 6.80558 20 11.5C20 13.523 19.2933 15.381 18.1132 16.8404L21.1364 19.8636C21.4879 20.2151 21.4879 20.7849 21.1364 21.1364C20.7849 21.4879 20.2151 21.4879 19.8636 21.1364L16.8404 18.1132C15.381 19.2933 13.523 20 11.5 20C6.80558 20 3 16.1944 3 11.5C3 6.80558 6.80558 3 11.5 3ZM11.5 18.2C15.2003 18.2 18.2 15.2003 18.2 11.5C18.2 7.79969 15.2003 4.8 11.5 4.8C7.79969 4.8 4.8 7.79969 4.8 11.5C4.8 15.2003 7.79969 18.2 11.5 18.2Z" fill="currentColor"/>
            </svg>
            <input id="repoFilter" type="text" placeholder="Filter" />
          </div>
          <button id="addRepoBtn" class="add-btn" title="Add local repository">+</button>
        </div>
        <div id="recentSection">
          <div id="recentList" class="recent-list"></div>
          <div id="recentEmpty" class="recent-empty">No recent repos.<br>Click + to add one.</div>
        </div>
      </aside>

      <!-- Column 2: Changes -->
      <aside id="changesPanel">
        <div class="changes-section">
          <label class="side-label">Include</label>
          <select id="modeSelect" class="mode-select">
            <option value="uncommitted" selected>Uncommitted changes (git)</option>
            <option value="unpushed">Unpushed commits (git)</option>
            <option value="last">Last commit only (git)</option>
            <option value="range">Select commit range (git)</option>
            <option value="baseline">Baseline (no git)</option>
          </select>
          <div id="rangePicker" style="display:none">
            <div class="range-row">
              <select id="fromCommit"></select>
              <span class="range-arrow">→</span>
              <select id="toCommit"></select>
              <button id="loadCommitsBtn" class="icon-btn" title="Refresh commits">↻</button>
            </div>
          </div>
          <button id="scanBtn" class="btn-block btn-primary">Scan for changes</button>
          <button id="baselineBtn" class="btn-block" style="display:none;margin-top:6px">Set baseline</button>
          <div id="baselineStatus" class="hint" style="display:none"></div>
        </div>

        <div id="fileArea" class="changes-section changes-files" style="display:none">
          <div class="file-header">
            <span id="fileCount"></span>
            <div class="file-actions">
              <button id="selectAllBtn">All</button>
              <button id="deselectAllBtn">None</button>
            </div>
          </div>
          <div id="fileList"></div>
        </div>

        <div id="changesEmpty" class="side-empty">
          <p>No changes scanned yet.</p>
          <p class="side-empty-sub">Load a repo and scan to see changes.</p>
        </div>

        <div id="zipBox">
          <div class="field">
            <label class="side-label">Output folder</label>
            <div class="row">
              <input id="outputDir" type="text" placeholder="C:\Users\you\updates" />
              <button id="browseOutputBtn" class="icon-btn" title="Browse">…</button>
            </div>
          </div>
          <button id="generateBtn" class="btn-block btn-commit">Generate Zip</button>
        </div>
      </aside>

      <!-- Column 3: Diff viewer -->
      <main id="mainPane">
        <div id="diffHeader" style="display:none">
          <span id="diffFileStatus" class="file-status"></span>
          <span id="diffFilePath"></span>
        </div>
        <div id="diffPane">
          <div id="mainEmpty" class="main-empty">
            <div class="main-empty-icon">⌗</div>
            <p>Select a file to view its diff</p>
            <p class="main-empty-sub">Scan a repo to get started</p>
          </div>
        </div>
        <div id="resultBanner" style="display:none"></div>
      </main>
    </div>

    <footer id="logStrip"></footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
