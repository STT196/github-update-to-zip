name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            ext: .exe
          - os: ubuntu-latest
            platform: linux/amd64
            ext: ""
          - os: macos-latest
            platform: darwin/amd64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build
        run: wails build -platform ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: github-update-tracker-${{ runner.os }}-${{ runner.arch }}
          path: build/bin/github-update-tracker${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            github-update-tracker-Windows-*/github-update-tracker.exe
            github-update-tracker-Linux-*/github-update-tracker
            github-update-tracker-macOS-*/github-update-tracker
          generate_release_notes: true
