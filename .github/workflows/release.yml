name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            binary: build/bin/github-update-tracker.exe
            tags: ""
          - os: ubuntu-latest
            platform: linux/amd64
            binary: build/bin/github-update-tracker
            tags: webkit2_41
          - os: macos-latest
            platform: darwin/universal
            binary: build/bin/github-update-tracker.app.zip
            tags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        if: matrix.tags == ''
        timeout-minutes: 15
        run: wails build -platform ${{ matrix.platform }}

      - name: Build (Linux webkit2_41)
        if: matrix.tags != ''
        timeout-minutes: 15
        run: wails build -platform ${{ matrix.platform }} -tags ${{ matrix.tags }}

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: cd build/bin && zip -r github-update-tracker.app.zip github-update-tracker.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            github-update-tracker.exe
            github-update-tracker
            github-update-tracker.app.zip
          body: |
            Simple desktop tool to zip changed files from a git repo for deployment.

            ### What it does
            - Point it at any local git repo
            - Choose what to zip: uncommitted changes, unpushed commits, last commit, or a range of commits
            - Produces a timestamped zip with full file paths preserved

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows  | `github-update-tracker.exe` |
            | Linux    | `github-update-tracker` |
            | macOS    | `github-update-tracker.app` |

            ### Requirements
            - `git` on PATH
            - Windows: WebView2 runtime (included in Windows 10+)
